name: AntiSavedHotbarAbuse
version: 1.0.9
main: me.maksde.antisavedhotbar.AntiSavedHotbarAbuse
api-version: '1.21'
author: freshLike
description: Защита сервера от нелегальных предметов из Saved Hotbar
commands:
  antisavedhotbar:
    description: Основная команда управления плагином AntiSavedHotbarAbuse
    usage: /antisavedhotbar [reload|scan]
    aliases: [ash]
permissions:
  antisavedhotbar.bypass:
    description: Разрешает обход всех проверок на нелегальные предметы
    default: op
  antisavedhotbar.reload:
    description: Разрешает перезагрузку конфигурации и запуск ручного сканирования
    default: op
